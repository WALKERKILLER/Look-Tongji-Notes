interface:
  display_name: "Look Tongji Notes"
  short_description: "9 short commands (/setup, /list, /trans, /note, /wiki, /add, /page, /cheatsheet, /ralphtrans) for Tongji Look course discovery, lecture transcription, note generation, course wiki building, GitHub Pages deployment, and batch processing."
  default_prompt: "Use the 9 short commands for Look Tongji Notes: /setup to configure credentials and workspace, /list to discover and select courses, /trans to transcribe a lecture, /note to generate study notes with timeline, /add to import supplementary materials, /wiki to build and serve the course knowledge base, /page to deploy to GitHub Pages via gh CLI, /cheatsheet to create exam cheat sheets, and /ralphtrans to batch transcribe an entire course with checkpoint/resume."
skills:
  path: "skills"
