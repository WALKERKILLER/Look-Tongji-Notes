name: look_studio
description: "Look Studio — 同济 Look 录课平台客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  animations: ^3.0.0
  dynamic_color: ^2.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  gpt_markdown: ^1.3.4
  http: ^1.6.0
  intl: ^0.20.3
  material_color_utilities: ^0.13.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  val_latex_flutter: ^0.1.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/providers/
    - assets/brands/
    - assets/schools/
