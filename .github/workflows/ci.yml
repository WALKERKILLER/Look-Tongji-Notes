name: Studio CI

on:
  push:
    branches: ["app"]
  pull_request:
    branches: ["app"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  governance:
    name: governance (gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/run-gates.mjs

  lookd:
    name: lookd (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lookd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lookd/go.mod
          cache-dependency-path: lookd/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - run: go build -trimpath -ldflags='-s -w' -o bin/lookd ./cmd/lookd

  agent:
    name: agent (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run check

  app:
    name: app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: look-studio-linux-bundle
          path: app/build/linux/x64/release/bundle
          retention-days: 7
