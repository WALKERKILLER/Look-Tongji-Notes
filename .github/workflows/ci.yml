name: Studio CI

on:
  push:
    branches: ["app"]
  pull_request:
    branches: ["app"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # Decides which parts a change touches. Jobs for untouched parts are skipped
  # through `if:`; GitHub reports a skipped job as successful, so the required
  # checks on `app` still pass. Markdown-only changes skip every build job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      lookd: ${{ steps.filter.outputs.lookd }}
      agent: ${{ steps.filter.outputs.agent }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Run everything when there is no usable base: manual runs, new
          # branches, force-pushes.
          all=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! files="$(git diff --name-only "$BASE"...HEAD)"; then
            all=true
          fi
          code="$(printf '%s\n' "${files:-}" | grep -Ev '\.md$' || true)"
          for part in lookd agent app; do
            if [ "$all" = true ] || printf '%s\n' "$code" | grep -Eq "^(${part}/|\.github/workflows/ci\.yml$)"; then
              echo "$part=true" >> "$GITHUB_OUTPUT"
            else
              echo "$part=false" >> "$GITHUB_OUTPUT"
            fi
          done
          cat "$GITHUB_OUTPUT"

  governance:
    name: governance (gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/run-gates.mjs

  lookd:
    name: lookd (Go)
    needs: changes
    # Fail safe: if change detection itself fails, run the job anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lookd == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lookd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lookd/go.mod
          cache-dependency-path: lookd/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - run: go build -trimpath -ldflags='-s -w' -o bin/lookd ./cmd/lookd
      # Release packages also ship lookd for Windows and macOS.
      - name: Cross-compile for Windows and macOS
        run: |
          for t in windows/amd64 darwin/arm64 darwin/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/lookd
          done

  agent:
    name: agent (Node)
    needs: changes
    # Fail safe: if change detection itself fails, run the job anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.agent == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  app:
    name: app (Flutter)
    needs: changes
    # Fail safe: if change detection itself fails, run the job anyway.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: look-studio-linux-bundle
          path: app/build/linux/x64/release/bundle
          retention-days: 7
