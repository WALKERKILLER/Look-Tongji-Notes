name: Skill packaging

on:
  push:
    branches: ["main", "master", "wiki"]
    paths:
      - "SKILL.md"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - ".gemini-plugin/**"
      - ".hermes-agent-plugin/**"
      - ".openclaw-plugin/**"
      - ".opencode-plugin/**"
      - ".agents/**"
      - "agents/**"
      - "skills/setup/**"
      - "skills/list/**"
      - "skills/trans/**"
      - "skills/note/**"
      - "skills/add/**"
      - "skills/ralphtrans/**"
      - "skills/wiki/**"
      - "skills/cheatsheet/**"
      - ".github/workflows/skill-packaging.yml"
  pull_request:
    paths:
      - "SKILL.md"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - ".gemini-plugin/**"
      - ".hermes-agent-plugin/**"
      - ".openclaw-plugin/**"
      - ".opencode-plugin/**"
      - ".agents/**"
      - "agents/**"
      - "skills/setup/**"
      - "skills/list/**"
      - "skills/trans/**"
      - "skills/note/**"
      - "skills/add/**"
      - "skills/ralphtrans/**"
      - "skills/wiki/**"
      - "skills/cheatsheet/**"
      - ".github/workflows/skill-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin JSON files
        run: |
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .cursor-plugin/plugin.json >/dev/null
          python -m json.tool .cursor-plugin/marketplace.json >/dev/null
          python -m json.tool .gemini-plugin/plugin.json >/dev/null
          python -m json.tool .hermes-agent-plugin/plugin.json >/dev/null
          python -m json.tool .openclaw-plugin/plugin.json >/dev/null
          python -m json.tool .opencode-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null

      - name: Validate skills/ flat structure (8 skills)
        run: |
          for skill in setup list trans note add ralphtrans wiki cheatsheet; do
            test -f "skills/${skill}/SKILL.md"
            test -f "skills/${skill}/manifest.yaml"
            grep -q "name: ${skill}" "skills/${skill}/SKILL.md"
          done
